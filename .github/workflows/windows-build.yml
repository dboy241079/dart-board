name: Build Windows camera test

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'src/**'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: dart-camera-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore compiled dependency cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure and install minimal OpenCV features
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/DartCameraTest.exe dist/
          $opencvBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin'
          $runtimeDlls = Get-ChildItem $opencvBin -Filter '*.dll'
          if (-not $runtimeDlls) { throw "No runtime DLLs found in $opencvBin" }
          $runtimeDlls | Copy-Item -Destination dist/
          foreach ($module in @('opencv_core*.dll', 'opencv_highgui*.dll', 'opencv_videoio*.dll')) {
            if (-not (Get-ChildItem dist -Filter $module)) {
              throw "Required OpenCV module DLL was not packaged: $module"
            }
          }
          Compress-Archive -Path dist/* -DestinationPath DartCameraTest-Windows-x64.zip -Force

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: DartCameraTest-Windows-x64
          path: DartCameraTest-Windows-x64.zip
          retention-days: 14
